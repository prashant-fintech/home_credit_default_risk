[project]
name = "home-credit-default-risk"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "lightgbm>=4.3",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "pydantic-settings>=2.2",
    "mlflow>=2.12",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "python-dotenv>=1.0",
    "pyarrow>=16.0",        # parquet I/O for processed features
    "s3fs>=2024.3",         # pandas S3 read support (s3:// URIs)
    "shap>=0.45",           # SHAP explanations for LightGBM
    "optuna>=3.6",          # hyperparameter optimisation
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx>=0.27",          # FastAPI test client
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
