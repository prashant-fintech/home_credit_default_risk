lightgbm:
  objective: binary
  metric: auc
  boosting_type: gbdt
  n_estimators: 5000
  learning_rate: 0.02
  num_leaves: 63
  max_depth: -1
  min_child_samples: 50
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.8
  reg_alpha: 0.1
  reg_lambda: 0.1
  n_jobs: -1
  verbose: -1
  early_stopping_rounds: 100

training:
  n_folds: 5
  seed: 42
  stratified: true

serving:
  host: "0.0.0.0"
  port: 8000
  model_stage: "Production"
